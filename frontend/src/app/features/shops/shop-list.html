<h1>Sklepy</h1>

@if (isAdmin) {
  <div class="page-actions">
    <button mat-flat-button (click)="openDialog()">
      <mat-icon>add</mat-icon>
      Nowy sklep
    </button>
  </div>
}

<mat-card class="table-card">
  @if (rows().length === 0) {
    <p class="empty">Brak sklepów.</p>
  } @else {
    <table mat-table [dataSource]="rows()">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nazwa</th>
        <td mat-cell *matCellDef="let shop">{{ shop.name }}</td>
      </ng-container>

      <ng-container matColumnDef="contactEmail">
        <th mat-header-cell *matHeaderCellDef>E-mail kontaktowy</th>
        <td mat-cell *matCellDef="let shop">{{ shop.contactEmail }}</td>
      </ng-container>

      <ng-container matColumnDef="isActive">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let shop">{{ shop.isActive ? 'Aktywny' : 'Nieaktywny' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let shop">
          <button mat-icon-button (click)="openDialog(shop)" aria-label="Edytuj">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="remove(shop)" aria-label="Usuń">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns"></tr>
    </table>
  }
</mat-card>
